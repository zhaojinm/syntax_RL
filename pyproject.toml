[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "syntax-rl"
version = "0.1.0"
description = "Task rewards and evaluation tools for Syntax-RL"
requires-python = ">=3.10"

[project.optional-dependencies]
test = ["pytest>=8"]
evaluation = ["nltk>=3.8"]

[tool.setuptools.packages.find]
include = ["syntax_rl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
